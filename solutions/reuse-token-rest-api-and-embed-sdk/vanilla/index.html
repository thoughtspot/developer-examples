<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/ts-logo.svg" />
  <title>Reuse Token — REST API SDK + Embed SDK</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1a1a1a;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid #e2e4e8;
    }
    header img { height: 24px; }
    header h1 { font-size: 16px; margin: 0; }
    #backBtn { padding: 6px 12px; font-size: 13px; cursor: pointer; }
    #backBtn[hidden] { display: none; }
    #liveboardList { list-style: none; margin: 0; padding: 12px 20px; max-width: 640px; }
    #liveboardList li + li { border-top: 1px solid #e2e4e8; }
    #liveboardList button {
      width: 100%;
      text-align: left;
      padding: 14px 8px;
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
    #liveboardList button:hover { background: rgba(66, 133, 244, 0.08); }
    #embed-wrapper { flex: 1 1 auto; min-height: 0; }
    #embed-wrapper[hidden] { display: none; }
    #embed-wrapper iframe { width: 100%; height: 100%; border: none; }
    #status { padding: 20px; color: #666; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <img src="/ts-logo.svg" alt="ThoughtSpot logo" />
      <h1>Reuse Token — REST API SDK + Embed SDK</h1>
      <button id="backBtn" hidden>← Back to list</button>
    </header>
    <p id="status">Loading liveboards…</p>
    <ul id="liveboardList" hidden></ul>
    <div id="embed-wrapper" hidden></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
